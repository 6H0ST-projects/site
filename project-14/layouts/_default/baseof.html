<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    {{ $description := .Description | default .Site.Params.description }}
    {{ $ogImage := .Params.ogImage | default "og-image-project-014.png" }}
    <meta name="description" content="{{ $description }}">
    <meta name="author" content="{{ .Site.Params.author }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <style>{{ partial "critical-css.html" . | safeCSS }}</style>
    {{ $styles := resources.Get "css/main.css" | fingerprint }}
    <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="icon" href="/boo.svg" type="image/svg+xml">
    <meta property="og:title" content="{{ .Title | default .Site.Title }}">
    <meta property="og:description" content="{{ $description }}">
    <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="{{ .Site.Title }}">
    <meta property="og:image" content="{{ $ogImage | absURL }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ .Title | default .Site.Title }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title | default .Site.Title }}">
    <meta name="twitter:description" content="{{ $description }}">
    <meta name="twitter:image" content="{{ $ogImage | absURL }}">
    <meta name="twitter:image:alt" content="{{ .Title | default .Site.Title }}">
    {{ block "extra-head" . }}{{ end }}
</head>
<body class="project-page {{ if .IsHome }}project-home{{ else }}{{ .File.BaseFileName }}{{ end }}">
    {{ block "main" . }}{{ end }}
</body>
</html>
