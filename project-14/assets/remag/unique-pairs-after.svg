<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 250" role="img" aria-labelledby="unique-pairs-after-title unique-pairs-after-desc" style="font-family:inherit">
<title id="unique-pairs-after-title">unique pairs: after</title>
<desc id="unique-pairs-after-desc">Contract each unique unit-cell orbital pair once, then apply each image phase and scatter to the original sparse output. FePt16 has 20,736 unique pairs for 217,840 image entries.</desc>
<defs><marker id="unique-pairs-after-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#FF0860" stroke-width="1.4" /></marker></defs>
<rect x="44" y="12" width="192" height="37" rx="3" fill="#FFF1F6" stroke="#FF0860" data-motion-node="sum" data-motion-meter="" />
<text x="140.0" y="34.5" font-size="13" fill="#252830" text-anchor="middle" font-weight="300">Sum over states once</text>
<text x="140" y="69" font-size="12" fill="#FF0860" text-anchor="middle" font-weight="300" data-motion-node="pair">Unique pair (i, j)</text>
<path d="M140 77 V96 H47 V113" fill="none" stroke="#FF0860" stroke-width="1.3" data-motion-edge="phase-0" />
<rect x="8" y="117" width="78" height="42" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="phase-0" />
<text x="47.0" y="134.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Image R1</text>
<text x="47.0" y="150.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">+ phase</text>
<path d="M47 161 V181" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#unique-pairs-after-arrow)" data-motion-edge="scatter-0" />
<path d="M140 77 V96 H140 V113" fill="none" stroke="#FF0860" stroke-width="1.3" data-motion-edge="phase-1" />
<rect x="101" y="117" width="78" height="42" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="phase-1" />
<text x="140.0" y="134.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Image R2</text>
<text x="140.0" y="150.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">+ phase</text>
<path d="M140 161 V181" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#unique-pairs-after-arrow)" data-motion-edge="scatter-1" />
<path d="M140 77 V96 H233 V113" fill="none" stroke="#FF0860" stroke-width="1.3" data-motion-edge="phase-2" />
<rect x="194" y="117" width="78" height="42" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="phase-2" />
<text x="233.0" y="134.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Image R3</text>
<text x="233.0" y="150.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">+ phase</text>
<path d="M233 161 V181" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#unique-pairs-after-arrow)" data-motion-edge="scatter-2" />
<rect x="8" y="185" width="264" height="31" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="scatter" />
<text x="140.0" y="204.5" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Scatter into the same sparse output</text>
<text x="140" y="241" font-size="13" fill="#FF0860" text-anchor="middle" font-weight="700">20,736 unique-pair contractions</text>
</svg>
