<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 250" role="img" aria-labelledby="unique-pairs-before-title unique-pairs-before-desc" style="font-family:inherit">
<title id="unique-pairs-before-title">unique pairs: before</title>
<desc id="unique-pairs-before-desc">Three illustrative periodic entries for the same orbital pair each repeat the expensive occupied-state sum before applying their own phase.</desc>
<defs><marker id="unique-pairs-before-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#68717B" stroke-width="1.4" /></marker></defs>
<text x="140" y="19" font-size="12" fill="#68717B" text-anchor="middle" font-weight="300">Same pair (i, j), different images</text>
<rect x="8" y="41" width="53" height="32" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="image-0" />
<text x="34.5" y="61.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">R1</text>
<path d="M63 57 H78" fill="none" stroke="#68717B" stroke-width="1.3" marker-end="url(#unique-pairs-before-arrow)" data-motion-edge="sum-0" />
<rect x="81" y="41" width="115" height="32" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="sum-0" data-motion-meter="" />
<text x="138.5" y="61.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Sum over states</text>
<path d="M198 57 H211" fill="none" stroke="#68717B" stroke-width="1.3" marker-end="url(#unique-pairs-before-arrow)" data-motion-edge="phase-0" />
<rect x="214" y="41" width="59" height="32" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="phase-0" />
<text x="243.5" y="61.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Phase</text>
<rect x="8" y="99" width="53" height="32" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="image-1" />
<text x="34.5" y="119.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">R2</text>
<path d="M63 115 H78" fill="none" stroke="#68717B" stroke-width="1.3" marker-end="url(#unique-pairs-before-arrow)" data-motion-edge="sum-1" />
<rect x="81" y="99" width="115" height="32" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="sum-1" data-motion-meter="" />
<text x="138.5" y="119.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Sum over states</text>
<path d="M198 115 H211" fill="none" stroke="#68717B" stroke-width="1.3" marker-end="url(#unique-pairs-before-arrow)" data-motion-edge="phase-1" />
<rect x="214" y="99" width="59" height="32" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="phase-1" />
<text x="243.5" y="119.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Phase</text>
<rect x="8" y="157" width="53" height="32" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="image-2" />
<text x="34.5" y="177.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">R3</text>
<path d="M63 173 H78" fill="none" stroke="#68717B" stroke-width="1.3" marker-end="url(#unique-pairs-before-arrow)" data-motion-edge="sum-2" />
<rect x="81" y="157" width="115" height="32" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="sum-2" data-motion-meter="" />
<text x="138.5" y="177.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Sum over states</text>
<path d="M198 173 H211" fill="none" stroke="#68717B" stroke-width="1.3" marker-end="url(#unique-pairs-before-arrow)" data-motion-edge="phase-2" />
<rect x="214" y="157" width="59" height="32" rx="3" fill="white" stroke="#CAD0D6" data-motion-node="phase-2" />
<text x="243.5" y="177.0" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Phase</text>
<text x="140" y="241" font-size="13" fill="#68717B" text-anchor="middle" font-weight="700">217,840 image-entry contractions</text>
</svg>
