<title id="matrix-rotation-after-title">matrix rotation: after</title>
<desc id="matrix-rotation-after-desc">Large matrix rotation keeps a tile intermediate in shared memory, computes one Hermitian partner and writes its conjugate, and groups real and imaginary products into FP64 matrix instructions.</desc>
