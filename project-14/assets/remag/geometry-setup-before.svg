<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 348" role="img" aria-labelledby="geometry-setup-before-title geometry-setup-before-desc" style="font-family:inherit">
<title id="geometry-setup-before-title">geometry setup: before</title>
<desc id="geometry-setup-before-desc">Nonlocal setup uploads expanded queries, and initial mesh fields are produced on the CPU then uploaded.</desc>
