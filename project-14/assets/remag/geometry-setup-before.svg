<text x="140.0" y="244.0" font-size="13" fill="#252830" text-anchor="middle" font-weight="300">CPU: generate dense fields</text>
<path d="M140 259 V294" fill="none" stroke="#68717B" stroke-width="1.3" marker-end="url(#geometry-setup-before-arrow)"/>
<text x="153" y="280" font-size="11" fill="#68717B" text-anchor="start" font-weight="300">upload</text>
<rect x="24" y="297" width="232" height="34" rx="3" fill="white" stroke="#CAD0D6"/>
<text x="140.0" y="318.0" font-size="13" fill="#252830" text-anchor="middle" font-weight="300">GPU: electronic loop</text>
