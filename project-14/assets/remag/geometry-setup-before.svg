<text x="140" y="16" font-size="12" fill="#68717B" text-anchor="middle" font-weight="700">NONLOCAL QUERIES</text>
<rect x="24" y="29" width="232" height="37" rx="3" fill="white" stroke="#CAD0D6"/>
<text x="140.0" y="51.5" font-size="13" fill="#252830" text-anchor="middle" font-weight="300">CPU: expanded queries</text>
<path d="M140 68 V103" fill="none" stroke="#68717B" stroke-width="1.3" marker-end="url(#geometry-setup-before-arrow)"/>
<text x="153" y="90" font-size="11" fill="#68717B" text-anchor="start" font-weight="300">upload</text>
<rect x="24" y="106" width="232" height="37" rx="3" fill="white" stroke="#CAD0D6"/>
<text x="140.0" y="128.5" font-size="13" fill="#252830" text-anchor="middle" font-weight="300">GPU: consume queries</text>
<text x="140" y="165" font-size="14" fill="#68717B" text-anchor="middle" font-weight="700">1.335 GB staged</text>
<path d="M8 185 H272" fill="none" stroke="#68717B" stroke-width="1.3" stroke-dasharray="3 4"/>
<text x="140" y="210" font-size="12" fill="#68717B" text-anchor="middle" font-weight="700">INITIAL MESH FIELDS</text>
