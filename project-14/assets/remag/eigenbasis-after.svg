<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 250" role="img" aria-labelledby="eigenbasis-after-title eigenbasis-after-desc" style="font-family:inherit">
<title id="eigenbasis-after-title">eigenbasis: after</title>
<desc id="eigenbasis-after-desc">Each current Hamiltonian is transformed into its own previous eigenbasis after reorthogonalization. Refinement must still pass the same solver convergence test.</desc>
<defs><marker id="eigenbasis-after-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#FF0860" stroke-width="1.4"/></marker></defs>
<rect x="40" y="10" width="200" height="34" rx="3" fill="#FFF1F6" stroke="#FF0860"/>
<text x="140.0" y="31.0" font-size="13" fill="#252830" text-anchor="middle" font-weight="300">Previous eigenbasis</text>
<path d="M140 46 V61" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#eigenbasis-after-arrow)"/>
<rect x="40" y="64" width="200" height="34" rx="3" fill="#FFF1F6" stroke="#FF0860"/>
<text x="140.0" y="85.0" font-size="13" fill="#252830" text-anchor="middle" font-weight="300">Reorthogonalize</text>
<path d="M140 100 V115" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#eigenbasis-after-arrow)"/>
<rect x="40" y="118" width="200" height="34" rx="3" fill="#FFF1F6" stroke="#FF0860"/>
<text x="140.0" y="139.0" font-size="13" fill="#252830" text-anchor="middle" font-weight="300">Transform the current H</text>
<path d="M140 154 V166" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#eigenbasis-after-arrow)"/>
<rect x="40" y="169" width="200" height="34" rx="3" fill="#FFF1F6" stroke="#FF0860"/>
<text x="140.0" y="190.0" font-size="13" fill="#252830" text-anchor="middle" font-weight="300">Solve / refine</text>
<path d="M140 205 V224" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#eigenbasis-after-arrow)"/>
<text x="140" y="242" font-size="12" fill="#68717B" text-anchor="middle" font-weight="300">Same numerical stopping criterion</text>
</svg>
