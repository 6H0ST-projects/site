<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 250" role="img" aria-labelledby="local-solve-after-title local-solve-after-desc" style="font-family:inherit">
<title id="local-solve-after-title">local solve: after</title>
<desc id="local-solve-after-desc">The local 32-state matrix and its eigenvectors stay in shared memory inside a single GPU thread block during FP64 Jacobi rotations, then results are stored.</desc>
<defs><marker id="local-solve-after-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#FF0860" stroke-width="1.4"/></marker></defs>
<text x="140" y="22" font-size="12" fill="#68717B" text-anchor="middle" font-weight="300">Load the 32-state problem</text>
<path d="M140 30 V50" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#local-solve-after-arrow)"/>
<rect x="12" y="54" width="256" height="145" rx="3" fill="#FFF1F6" stroke="#FF0860"/>
<text x="140" y="77" font-size="12" fill="#FF0860" text-anchor="middle" font-weight="700">ONE GPU THREAD BLOCK</text>
<rect x="50" y="91" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="62" y="91" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="74" y="91" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="50" y="103" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="62" y="103" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="74" y="103" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="50" y="115" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="62" y="115" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="74" y="115" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="170" y="91" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="182" y="91" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="194" y="91" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="170" y="103" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="182" y="103" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="194" y="103" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="170" y="115" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="182" y="115" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<rect x="194" y="115" width="10" height="10" rx="0" fill="#FFF1F6" stroke="#FF0860"/>
<text x="140" y="141" font-size="12" fill="#252830" text-anchor="middle" font-weight="300">Matrix + vectors in shared memory</text>
<path d="M60 153 V177 H220 V153 H60" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#local-solve-after-arrow)"/>
<text x="140" y="168" font-size="12" fill="#FF0860" text-anchor="middle" font-weight="300">FP64 rotations</text>
<path d="M140 202 V222" fill="none" stroke="#FF0860" stroke-width="1.3" marker-end="url(#local-solve-after-arrow)"/>
<text x="140" y="241" font-size="12" fill="#68717B" text-anchor="middle" font-weight="300">Store the completed local result</text>
</svg>
