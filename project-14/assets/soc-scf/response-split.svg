<svg class="soc-diagram" viewBox="0 0 680 270" role="img" aria-labelledby="rsp-title rsp-desc" xmlns="http://www.w3.org/2000/svg">
<title id="rsp-title">The stored triplet splits one SCF step into two measurable responses</title>
<desc id="rsp-desc">Schematic. Input density leads to the local potential through the Hartree and exchange–correlation terms, K. The local potential leads to the output density through the Kohn–Sham response, chi-zero, which requires re-solving the orbitals. All three quantities are stored, so differences between evaluations sample both K and chi-zero, whose product is the Jacobian of the SCF map.</desc>
<defs><marker id="rsp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#939ba6"/></marker></defs>
<rect width="680" height="270" fill="#fff"/>
<g class="ksl-stored"><rect x="16" y="46" width="164" height="78"/><text x="98" y="76" class="d-h" text-anchor="middle">Input density</text><text x="98" y="98" class="d-m" text-anchor="middle">n, m</text><text x="98" y="115" class="d-badge" text-anchor="middle">STORED</text></g>
<g class="ksl-stored"><rect x="258" y="46" width="164" height="78"/><text x="340" y="76" class="d-h" text-anchor="middle">Local potential</text><text x="340" y="98" class="d-m" text-anchor="middle">V<tspan baseline-shift="sub" font-size="72%">0</tspan>, B</text><text x="340" y="115" class="d-badge" text-anchor="middle">STORED</text></g>
<g class="ksl-stored"><rect x="500" y="46" width="164" height="78"/><text x="582" y="76" class="d-h" text-anchor="middle">Output density</text><text x="582" y="98" class="d-m" text-anchor="middle">n, m</text><text x="582" y="115" class="d-badge" text-anchor="middle">STORED</text></g>
<g stroke="#939ba6" stroke-width="1.5" fill="none"><path class="rsp-edge" d="M182 85 H254" marker-end="url(#rsp-arrow)"/><path class="rsp-edge" d="M424 85 H496" marker-end="url(#rsp-arrow)"/></g>
<text x="218" y="76" class="d-h rsp-label" text-anchor="middle">K</text>
<text x="218" y="150" class="d-s rsp-sub" text-anchor="middle">Hartree +</text><text x="218" y="166" class="d-s rsp-sub" text-anchor="middle">exchange–correlation</text><text x="218" y="182" class="d-s rsp-sub" text-anchor="middle">(cheap, local)</text>
<text x="460" y="76" class="d-h rsp-label" text-anchor="middle">χ<tspan baseline-shift="sub" font-size="72%">0</tspan></text>
<text x="460" y="150" class="d-s rsp-sub" text-anchor="middle">Kohn–Sham response</text><text x="460" y="166" class="d-s rsp-sub" text-anchor="middle">(orbitals re-solved:</text><text x="460" y="182" class="d-s rsp-sub" text-anchor="middle">the expensive step)</text>
<line x1="16" y1="204" x2="664" y2="204" stroke="#e6e9ee"/>
<text x="16" y="228" class="d-t rsp-note">Differences between evaluations sample each arrow separately. Their product is the SCF Jacobian.</text>
<text x="16" y="250" class="d-t rsp-note">The spin–orbit terms are fixed during a run, so the stored potential carries every change in the Hamiltonian.</text>
</svg>
